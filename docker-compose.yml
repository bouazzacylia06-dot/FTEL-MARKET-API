services:
  ftelmarket-postgres:
    image: postgres:17-alpine
    container_name: ftelmarket-api-postgres
    ports:
      # 5433 côté hôte : le port 5432 est souvent pris par un PostgreSQL installé localement.
      - "5433:5432"
    environment:
      POSTGRES_USER: ftelmarket
      POSTGRES_PASSWORD: ftelmarket
      POSTGRES_DB: ftelmarket
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftelmarket -d ftelmarket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
